<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soletta · Beach Life Residential</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:#fff;color:var(--ink-900)}
  #kit-scroll{height:100vh;overflow-y:auto;scroll-behavior:smooth}
  a{color:inherit}
</style></head>
<body>
  <div id="kit-scroll"><div id="root"></div></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel">
    function App(){
      const contactRef = React.useRef(null);
      const toContact = () => {
        const sc = document.getElementById('kit-scroll');
        if (sc && contactRef.current) sc.scrollTo({ top: contactRef.current.offsetTop, behavior: 'smooth' });
      };
      return (<>
        <NavBar onContact={toContact}/>
        <Hero/>
        <Features/>
        <Masterplan/>
        <Plans/>
        <Contact ref={contactRef}/>
        <Footer/>
      </>);
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body></html>
