<!-- @dsCard group="Colors" viewport="700x150" name="Coral — accent" subtitle="The single accent: criterion & value. Use sparingly" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:20px}
  .scale{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}
  .sw{height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
  .n{font-size:11px;font-weight:700;letter-spacing:.04em}
  .h{font-size:10px;opacity:.85;font-variant-numeric:tabular-nums}
  .lt{color:var(--coral-700)}.dk{color:#fff}
</style></head>
<body>
  <div class="scale">
    <div class="sw lt" style="background:var(--coral-50)"><span class="n">50</span><span class="h">#FDEEE8</span></div>
    <div class="sw lt" style="background:var(--coral-100)"><span class="n">100</span><span class="h">#FCDDD2</span></div>
    <div class="sw lt" style="background:var(--coral-300)"><span class="n">300</span><span class="h">#F8A188</span></div>
    <div class="sw dk" style="background:var(--coral-500)"><span class="n">500 ★</span><span class="h">#F56B43</span></div>
    <div class="sw dk" style="background:var(--coral-600)"><span class="n">600</span><span class="h">#E2552F</span></div>
    <div class="sw dk" style="background:var(--coral-700)"><span class="n">700</span><span class="h">#C9461F</span></div>
  </div>
</body></html>
