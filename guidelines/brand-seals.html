<!-- @dsCard group="Brand" viewport="700x230" name="Credential seals" subtitle="Official Playa Platino & Pueblos Mágicos marks — used as proof, never decoration" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;display:flex;align-items:center;gap:44px;min-height:230px;padding:0 48px;box-sizing:border-box}
  .seal{display:flex;align-items:center;justify-content:center;flex:none}
  .seal img{display:block;object-fit:contain}
  /* heights only — width follows the file's own aspect ratio (no distortion) */
  .platino img{height:80px;width:auto}
  .magicos img{height:150px;width:auto}
  .note{color:var(--ink-500);max-width:280px;font-size:13px;line-height:1.55}
  .note b{color:var(--ink-900);font-weight:600}
</style></head>
<body>
  <div class="seal magicos"><img src="../assets/seals/pueblos-magicos.png" alt="Pueblos Mágicos"></div>
  <div class="seal platino"><img src="../assets/seals/playa-platino.png" alt="Playa Platino"></div>
  <div class="note"><b>Pueblos Mágicos</b> &amp; <b>Playa Platino</b> are the official approved marks, used unmodified as proof of credential — never resized disproportionately, recolored, or used as decoration. Place them with generous clear space on a calm light surface.</div>
</body></html>
