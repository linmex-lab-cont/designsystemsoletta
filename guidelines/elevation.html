<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--gray-50);padding:30px;display:flex;gap:26px;align-items:center;flex-wrap:wrap}
  .item{display:flex;flex-direction:column;align-items:center;gap:12px}
  .box{width:120px;height:74px;background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border-subtle)}
  .lab{font-size:11px;color:var(--ink-500);letter-spacing:.04em}
</style></head>
<body>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="lab">sm</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="lab">md · cards</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="lab">lg · hover</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-marine)"></div><span class="lab">marine</span></div>
</body></html>
