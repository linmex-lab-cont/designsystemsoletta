<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="rem-based scale, 12 → 84px" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:22px 32px}
  .row{display:flex;align-items:baseline;gap:18px;border-bottom:1px solid var(--gray-100);padding:5px 0}
  .row:last-child{border:0}
  .tok{font-size:11px;color:var(--ink-400);width:70px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .px{font-size:11px;color:var(--ink-300);width:40px;text-align:right}
  .s{color:var(--ink-900);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head>
<body>
  <div class="row"><span class="tok">7xl</span><span class="px">84</span><span class="s" style="font-size:38px">Soletta</span></div>
  <div class="row"><span class="tok">5xl</span><span class="px">48</span><span class="s" style="font-size:34px">Tierra firme frente al mar</span></div>
  <div class="row"><span class="tok">3xl</span><span class="px">30</span><span class="s" style="font-size:26px">Un plan a su medida</span></div>
  <div class="row"><span class="tok">xl</span><span class="px">20</span><span class="s" style="font-size:20px">Plusvalía en aumento, calma absoluta</span></div>
  <div class="row"><span class="tok">base</span><span class="px">16</span><span class="s" style="font-size:16px">Infraestructura lista para construir y escrituración inmediata.</span></div>
  <div class="row"><span class="tok">sm</span><span class="px">14</span><span class="s" style="font-size:14px;color:var(--ink-500)">A solo 40 minutos de Mérida · 90 m del mar</span></div>
</body></html>
