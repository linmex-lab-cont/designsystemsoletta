<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:26px 32px}
  .h{font-family:var(--font-sans);line-height:1.06;letter-spacing:-.01em;color:var(--ink-900)}
  .big{font-size:42px}
  .big .lt{font-weight:300;color:var(--marine-600)}
  .big .bd{font-weight:700}
  .mid{font-size:26px;font-weight:700;margin-top:14px}
  .meta{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-400);margin-top:18px}
</style></head>
<body>
  <div class="h big"><span class="lt">Tu visión merece</span><br><span class="bd">un plan a su medida</span></div>
  <div class="h mid">Tierra firme frente al mar</div>
  <div class="meta">Barlow · Light 300 + Bold 700 · the light/bold contrast is the brand headline signature</div>
</body></html>
