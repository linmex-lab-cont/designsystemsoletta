<!-- @dsCard group="Colors" viewport="700x150" name="Ink & cool neutrals" subtitle="Text & UI greys; official ink #1F2938" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:20px}
  .scale{display:grid;grid-template-columns:repeat(9,1fr);gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}
  .sw{height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
  .n{font-size:10px;font-weight:700}
  .h{font-size:9px;opacity:.8;font-variant-numeric:tabular-nums}
  .lt{color:var(--ink-700)}.dk{color:#fff}
</style></head>
<body>
  <div class="scale">
    <div class="sw dk" style="background:var(--ink-900)"><span class="n">ink900</span><span class="h">#1F2938</span></div>
    <div class="sw dk" style="background:var(--ink-700)"><span class="n">ink700</span><span class="h">#3A4452</span></div>
    <div class="sw dk" style="background:var(--ink-500)"><span class="n">ink500</span><span class="h">#5E6875</span></div>
    <div class="sw dk" style="background:var(--ink-400)"><span class="n">ink400</span><span class="h">#8A929C</span></div>
    <div class="sw lt" style="background:var(--ink-300)"><span class="n">ink300</span><span class="h">#B6BCC4</span></div>
    <div class="sw lt" style="background:var(--gray-200)"><span class="n">200</span><span class="h">#D8DBDE</span></div>
    <div class="sw lt" style="background:var(--gray-150)"><span class="n">150</span><span class="h">#E4E5E7</span></div>
    <div class="sw lt" style="background:var(--gray-100)"><span class="n">100</span><span class="h">#EFEFEF</span></div>
    <div class="sw lt" style="background:var(--gray-50);box-shadow:inset 0 0 0 1px var(--border-subtle)"><span class="n">50</span><span class="h">#F6F6F5</span></div>
  </div>
</body></html>
