<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="8px rhythm — calm is designed with space" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:24px 32px;display:flex;flex-direction:column;gap:9px}
  .row{display:flex;align-items:center;gap:14px}
  .tok{font-size:11px;color:var(--ink-400);width:64px;font-variant-numeric:tabular-nums}
  .px{font-size:11px;color:var(--ink-300);width:38px;text-align:right}
  .bar{height:14px;background:var(--marine-300);border-radius:3px}
</style></head>
<body>
  <div class="row"><span class="tok">space-2</span><span class="px">8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="tok">space-4</span><span class="px">16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="tok">space-5</span><span class="px">24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="tok">space-6</span><span class="px">32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="tok">space-8</span><span class="px">48</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="tok">space-9</span><span class="px">64</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="tok">space-11</span><span class="px">96</span><div class="bar" style="width:96px"></div></div>
</body></html>
