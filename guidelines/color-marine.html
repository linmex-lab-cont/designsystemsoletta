<!-- @dsCard group="Colors" viewport="700x150" name="Marine — primary" subtitle="The serene sea blue; official brand #2274A5" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:20px}
  .scale{display:grid;grid-template-columns:repeat(8,1fr);gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}
  .sw{height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
  .n{font-size:11px;font-weight:700;letter-spacing:.04em}
  .h{font-size:10px;opacity:.8;font-variant-numeric:tabular-nums}
  .lt{color:var(--ink-700)}.dk{color:#fff}
  .star{position:absolute;font-size:10px;margin-top:-2px}
</style></head>
<body>
  <div class="scale">
    <div class="sw lt" style="background:var(--marine-50)"><span class="n">50</span><span class="h">#EEF5F9</span></div>
    <div class="sw lt" style="background:var(--marine-100)"><span class="n">100</span><span class="h">#DCEAF2</span></div>
    <div class="sw lt" style="background:var(--marine-300)"><span class="n">300</span><span class="h">#9CC3DC</span></div>
    <div class="sw dk" style="background:var(--marine-500)"><span class="n">500</span><span class="h">#3E8AB8</span></div>
    <div class="sw dk" style="background:var(--marine-600)"><span class="n">600 ★</span><span class="h">#2274A5</span></div>
    <div class="sw dk" style="background:var(--marine-700)"><span class="n">700</span><span class="h">#1B5C84</span></div>
    <div class="sw dk" style="background:var(--marine-800)"><span class="n">800</span><span class="h">#16486A</span></div>
    <div class="sw dk" style="background:var(--marine-900)"><span class="n">900</span><span class="h">#11364F</span></div>
  </div>
</body></html>
