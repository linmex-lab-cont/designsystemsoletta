<!-- @dsCard group="Colors" viewport="700x150" name="Sand — warm neutral" subtitle="Premium-racional warmth; the 'arena metálica' direction" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:20px}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}
  .sw{height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
  .n{font-size:11px;font-weight:700}
  .h{font-size:10px;opacity:.85;font-variant-numeric:tabular-nums}
  .lt{color:var(--sand-700)}.dk{color:#fff}
</style></head>
<body>
  <div class="scale">
    <div class="sw lt" style="background:var(--sand-50);box-shadow:inset 0 0 0 1px var(--border-subtle)"><span class="n">50</span><span class="h">#F8F4EC</span></div>
    <div class="sw lt" style="background:var(--sand-100)"><span class="n">100</span><span class="h">#F2ECE0</span></div>
    <div class="sw lt" style="background:var(--sand-300)"><span class="n">300</span><span class="h">#E2D9C8</span></div>
    <div class="sw lt" style="background:var(--sand-500)"><span class="n">500</span><span class="h">#C9BBA3</span></div>
    <div class="sw dk" style="background:var(--sand-700)"><span class="n">700</span><span class="h">#9A8A6E</span></div>
  </div>
</body></html>
