<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:28px 32px;display:flex;flex-direction:column;gap:18px}
  .eye{font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--marine-600)}
  .sub{font-weight:600;font-size:13px;letter-spacing:.30em;text-transform:uppercase;color:var(--ink-700)}
  .label{font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-400)}
  .pill{display:inline-block;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--marine-600);padding:7px 18px;border-radius:999px}
</style></head>
<body>
  <div class="eye">Plan inversionista estratégico</div>
  <div class="sub">Soletta · Sisal</div>
  <div><span class="pill">Solo 35 lotes disponibles</span></div>
  <div class="label">tracking 0.16em (eyebrows) → 0.30em (sub-brand wordmark tags)</div>
</body></html>
