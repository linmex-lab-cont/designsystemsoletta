<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Editorial Post (1080×1350)" description="Soletta editorial photo-collage feed post — airy, Saudagar headline, offset image tiles" -->
<helmet>
  <script src="./ds-base.js"></script>
</helmet>
<div style="position:relative;width:1080px;height:1350px;overflow:hidden;font-family:var(--font-sans);background:#FBFAF7">

  <!-- top: logo + eyebrow -->
  <div style="position:absolute;top:64px;left:72px;right:72px;display:flex;align-items:flex-start;justify-content:space-between">
    <div style="font-family:var(--font-sans);font-weight:600;font-size:15px;letter-spacing:0.30em;text-transform:uppercase;color:var(--marine-600);padding-top:6px">Soletta · Sisal</div>
    <img src="../../assets/logo/soletta-isotipo-marine.png" alt="Soletta" style="width:74px;height:74px;object-fit:contain;display:block">
  </div>

  <!-- headline: thin uppercase Saudagar -->
  <h1 style="position:absolute;top:150px;left:72px;right:72px;margin:0;font-family:var(--font-display);font-weight:400;font-size:74px;line-height:1.04;letter-spacing:0.01em;text-transform:uppercase;color:var(--ink-900)">En Sisal, cada día<br>tiene su <span style="color:var(--marine-600)">propio ritmo</span></h1>

  <!-- coral hairline accent -->
  <div style="position:absolute;top:340px;left:74px;width:96px;height:3px;background:var(--coral-500)"></div>

  <!-- photo collage -->
  <!-- large hero -->
  <div style="position:absolute;top:430px;left:188px;width:720px;height:540px;overflow:hidden;box-shadow:0 28px 70px rgba(17,54,79,0.18)">
    
  <img src="../../assets/imagery/tile-sea.png" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>
  <!-- offset warm tile, top-right -->
  <div style="position:absolute;top:372px;right:72px;width:262px;height:208px;overflow:hidden;box-shadow:0 18px 44px rgba(17,54,79,0.18);outline:8px solid #FBFAF7">
    <img src="../../assets/imagery/terrace-sunset.png" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
  </div>
  <!-- offset sand/coast tile, bottom-left -->
  <div style="position:absolute;top:872px;left:72px;width:244px;height:196px;overflow:hidden;box-shadow:0 18px 44px rgba(17,54,79,0.18);outline:8px solid #FBFAF7">
    
  <img src="../../assets/imagery/masterplan-aerial.png" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block; position: static"></div>

  <!-- supporting copy -->
  <p style="position: absolute; top: 1106px; left: 71px; width: 560px; margin: 0; font-size: 22px; line-height: 1.5; color: var(--ink-500)">Tierra firme frente al mar, con la calma de un Pueblo Mágico y la certeza de una inversión que crece contigo.</p>

  <!-- footer: CTA + sub-brand -->
  <div style="position:absolute;left:72px;right:72px;bottom:72px;display:flex;align-items:flex-end;justify-content:space-between">
    <div style="display:inline-flex;align-items:center;gap:11px;background:var(--coral-500);color:#fff;font-family:var(--font-sans);font-weight:600;font-size:20px;letter-spacing:0.02em;padding:16px 36px;border-radius:999px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
      Contáctame
    </div>
    <div style="text-align:right;font-family:var(--font-sans);font-weight:600;font-size:12px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ink-400)">Beach Life Residential<br><span style="color:var(--ink-300)">grupolinmex.mx</span></div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1350}}"></script>
</body>
</html>
