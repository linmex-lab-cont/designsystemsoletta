<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Promo Post (1080×1350)" description="Soletta Instagram/promo post — photo, coral headline band, stats and CTA" -->
<helmet>
  <script src="./ds-base.js"></script>
</helmet>
<div style="position:relative;width:1080px;height:1350px;overflow:hidden;font-family:var(--font-sans);background:var(--marine-900)">

  <img src="../../assets/imagery/terrace-sunset.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
  <div style="position:absolute;inset:0;background:linear-gradient(to bottom, rgba(17,54,79,0.55) 0%, rgba(17,54,79,0.05) 32%, rgba(17,54,79,0.12) 60%, rgba(17,54,79,0.78) 100%)"></div>

  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:72px 72px 64px">

    <!-- Official logo lockup (LOGOTIPO, white) -->
    

    <div style="display:flex;flex-direction:column;align-items:center;color:#fff">
      <img src="../../assets/logo/soletta-logotipo-white.png" alt="Soletta" style="width:300px;height:300px;object-fit:contain;display:block">
      
    </div><div style="flex:1"></div>

    <!-- Coral headline band (signature motif) -->
    <div style="background:var(--coral-500);padding:18px 30px;align-self:center;max-width:760px">
      <h1 style="margin:0;font-family:var(--font-sans);font-weight:700;font-size:50px;line-height:1.08;letter-spacing:-0.01em;color:#fff;text-align:center;text-wrap:balance">Tierra firme frente al mar para un futuro familiar sólido.</h1>
    </div>

    <p style="margin:26px 0 0;font-size:24px;line-height:1.45;color:rgba(255,255,255,0.86);text-align:center;max-width:680px">Aprovecha las opciones de <strong style="color:#fff;font-weight:700">financiamiento a tu medida</strong>.</p>

    <!-- Stats row -->
    <div style="display:flex;gap:64px;margin-top:38px;color:#fff">
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
        <span style="font-weight:600;font-size:15px;letter-spacing:0.16em;text-transform:uppercase;opacity:0.9;margin-bottom:6px">Medidas desde</span>
        <span style="font-weight:700;font-size:46px;line-height:1">8 × 20 m</span>
      </div>
      <div style="width:1.5px;background:rgba(255,255,255,0.3)"></div>
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center">
        <span style="font-weight:600;font-size:15px;letter-spacing:0.16em;text-transform:uppercase;opacity:0.9;margin-bottom:6px">Acceso al mar</span>
        <span style="font-weight:700;font-size:46px;line-height:1">a solo 90 m</span>
      </div>
    </div>

    <!-- CTA -->
    <div style="display:inline-flex;align-items:center;gap:12px;margin-top:46px;background:var(--coral-500);color:#fff;font-weight:600;font-size:22px;letter-spacing:0.02em;padding:18px 42px;border-radius:999px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
      Contáctame
    </div>

    <div style="margin-top:34px;text-align:center;color:rgba(255,255,255,0.62);font-size:13px;letter-spacing:0.16em;text-transform:uppercase">Un desarrollo de LINMEX · grupolinmex.mx</div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1350}}"></script>
</body>
</html>
