<!-- @dsCard group="Components" viewport="700x340" name="Cards & Feature Badges" subtitle="Sober surfaces and the marine icon disc" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--gray-50);font-family:var(--font-sans);padding:28px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}
  h3{font-family:var(--font-sans);font-weight:700;font-size:18px;margin:0 0 6px;letter-spacing:-.01em}
  p{margin:0;font-size:14px;color:var(--ink-500);line-height:1.5}
  .marine h3{color:#fff}.marine p{color:rgba(255,255,255,.74)}
  .badges{display:flex;gap:18px;align-items:center;margin-top:24px;flex-wrap:wrap}
</style></head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Card, FeatureBadge, Stat } = window.SolettaDesignSystem_19cf15;
    const Ic = ({n,s=22})=>{const d=lucide.icons[n]||[];return React.createElement('svg',{width:s,height:s,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:1.75,strokeLinecap:'round',strokeLinejoin:'round'},d.map((c,i)=>React.createElement(c[0],{...c[1],key:i})));};
    function App(){return (
      <div>
        <div className="grid">
          <Card><h3>Escrituración inmediata</h3><p>Certeza jurídica desde el día uno; tu inversión queda en firme.</p></Card>
          <Card variant="sand"><h3>Calle blanca compactada</h3><p>Infraestructura lista para iniciar a construir.</p></Card>
          <Card variant="marine" className="marine"><Stat value="24%" label="Plusvalía proyectada" color="white" align="left"/></Card>
        </div>
        <div className="badges">
          <FeatureBadge icon={<Ic n="TrendingUp" s={30}/>}/>
          <FeatureBadge icon={<Ic n="FileCheck" s={30}/>} variant="marine-deep"/>
          <FeatureBadge icon={<Ic n="Waves" s={30}/>} variant="coral"/>
          <FeatureBadge icon={<Ic n="MapPin" s={30}/>} variant="soft"/>
          <FeatureBadge icon={<Ic n="Clock" s={30}/>} variant="outline"/>
        </div>
      </div>
    );}
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body></html>
